<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}WasteWatch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ================================================================
       WasteWatch — Design System
       Dark teal + sharp green accent, clean utility aesthetic
    ================================================================ */
    :root {
      --bg:          #0d1117;
      --surface:     #161c27;
      --surface-2:   #1e2633;
      --border:      #2a3344;
      --accent:      #2ecc71;       /* WasteWatch green */
      --accent-dim:  #27ae60;
      --text:        #e8edf5;
      --text-muted:  #7a8899;
      --danger:      #e74c3c;
      --warning:     #f39c12;
      --radius:      12px;
      --font-head:   'Syne', sans-serif;
      --font-body:   'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ---- Nav ---- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }
    .navbar-brand .icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .navbar-actions { display: flex; gap: 8px; align-items: center; }

    /* ---- Page wrapper ---- */
    .page { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

    /* ---- Cards ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-dark {
      background: var(--surface-2);
      border-color: transparent;
    }

    /* ---- Stat cards ---- */
    .stat-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }
    .stat-card {
      background: var(--surface-2);
      border-radius: var(--radius);
      padding: 16px 18px;
      min-width: 130px;
      flex-shrink: 0;
    }
    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-family: var(--font-head);
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-primary:hover { opacity: .9; }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-full { width: 100%; }
    .btn-sm { padding: 7px 14px; font-size: 12px; }

    /* ---- Forms ---- */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 14px;
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--accent); }
    textarea.form-input { resize: vertical; }
    select.form-input option { background: var(--surface-2); }

    /* ---- Report list items ---- */
    .report-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .report-item:last-child { border-bottom: none; }
    .report-pin {
      width: 32px; height: 32px;
      background: #2d1f1f;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .report-info { flex: 1; }
    .report-type {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .report-location {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .report-date {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ---- Badges ---- */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .badge-resolved { background: #1a3a2a; color: var(--accent); }
    .badge-pending  { background: #3a2e1a; color: var(--warning); }
    .badge-rejected { background: #3a1a1a; color: var(--danger); }
    .badge-approved { background: #1a2a3a; color: #5dade2; }

    /* ---- Section heading ---- */
    .section-title {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* ---- Messages ---- */
    .messages { list-style: none; margin-bottom: 16px; }
    .messages li {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .messages li.success { background: #1a3a2a; color: var(--accent); border: 1px solid #27ae60; }
    .messages li.error   { background: #3a1a1a; color: var(--danger); border: 1px solid var(--danger); }
    .messages li.info    { background: #1a2a3a; color: #5dade2; border: 1px solid #2980b9; }

    /* ---- Map placeholder ---- */
    .map-placeholder {
      background: var(--surface-2);
      border-radius: var(--radius);
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .map-placeholder::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 39px, var(--border) 40px
      ),
      repeating-linear-gradient(
        90deg, transparent, transparent 39px, var(--border) 40px
      );
      opacity: .3;
    }
    .map-pill {
      position: absolute;
      top: 14px; right: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.6;
    }

    /* ---- Auth pages ---- */
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo .logo-icon {
      width: 56px; height: 56px;
      background: var(--accent);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 12px;
    }
    .auth-logo h1 {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 800;
    }
    .auth-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .auth-footer a { color: var(--accent); text-decoration: none; }

    a { color: inherit; }
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 13px; }
    .mt-8 { margin-top: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-8 { gap: 8px; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .btn-row .btn { flex: 1; }

    /* Error list under form fields */
    .errorlist { list-style: none; margin-top: 4px; }
    .errorlist li { font-size: 11px; color: var(--danger); }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block nav %}
  <nav class="navbar">
    <a href="{% url 'watcher:dashboard' %}" class="navbar-brand">
      <span class="icon">🗑️</span>
      WasteWatch
    </a>
    <div class="navbar-actions">
      {% if user.is_authenticated %}
        <span class="text-muted text-sm">{{ user.full_name }}</span>
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline btn-sm">Logout</a>
      {% endif %}
    </div>
  </nav>
  {% endblock %}

  {% if messages %}
    <div class="page" style="padding-bottom:0">
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
